name: CI

on:
  pull_request:
    branches: [main, staging, prod]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Let an in-flight Development import finish when another commit lands.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version-check:
    # The staging and prod rulesets require this check by name.
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check the version setup
        run: scripts/release/check-version.sh

  build-and-test:
    # The staging and prod rulesets require this check by name.
    name: Build and test
    needs: version-check
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries | sort_by(.key) | .[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | select((.key | split("iOS-")[1] | split("-")[0] | tonumber) >= 27)
              | .value[] | select(.name | startswith("iPhone"))] | reverse
            | (map(select(.name == "iPhone 17e"))[0]
               // map(select(.name | endswith(" Pro")))[0] // .[0]) | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          boot_log="$RUNNER_TEMP/search-simulator-boot.log"
          xcrun simctl bootstatus "$udid" -b | tee "$boot_log"
          if grep -q 'Data Migration Failed' "$boot_log"; then
            xcrun simctl shutdown "$udid"
            xcrun simctl bootstatus "$udid" -b | tee "$boot_log"
            if grep -q 'Data Migration Failed' "$boot_log"; then
              echo "::error::Simulator data migration failed again after restart."
              exit 1
            fi
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test the iPhone app (builds the watch app too)
        run: |
          xcodebuild -project WindRun.xcodeproj -scheme WindRun \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath build/WindRunTests.xcresult \
            -quiet test

      - name: Evaluate deterministic search on synthetic development cases
        run: |
          python3 -B -m unittest discover -s scripts/search-evaluation -p 'test_*.py'
          python3 scripts/search-evaluation/corpus.py verify
          python3 scripts/search-evaluation/corpus.py export --split development --output build/search-input/corpus.json
          python3 scripts/search-evaluation/run.py --input build/search-input/corpus.json \
            --output build/search-evaluation --derived-data build/DerivedData \
            --destination "${{ steps.simulator.outputs.udid }}" --lanes legacy,rules
          python3 scripts/search-evaluation/score.py --input build/search-input/corpus.json --run build/search-evaluation

      - name: Check workout recovery regressions
        run: |
          python3 scripts/search-evaluation/corpus.py export --split validation --output build/search-recovery-input/corpus.json
          python3 -B scripts/search-evaluation/followup.py replay --input build/search-recovery-input/corpus.json \
            --output build/search-recovery --derived-data build/DerivedData --existing-build --role revised --lanes rules \
            --destination "${{ steps.simulator.outputs.udid }}"
          python3 -B scripts/search-evaluation/check_recovery.py --input build/search-recovery-input/corpus.json --run build/search-recovery

      - name: Keep public search measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SearchDevelopment-${{ github.run_number }}
          path: |
            build/search-evaluation/manifest.json
            build/search-evaluation/summary.json
            build/search-evaluation/observations.json
            build/search-evaluation/diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the watch app on its own
        run: |
          xcodebuild -project WindRun.xcodeproj -scheme WindRunWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -quiet build

      # -quiet hides why tests failed; the result bundle has it.
      - name: Show why the tests failed
        if: failure()
        run: |
          [ -d build/WindRunTests.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path build/WindRunTests.xcresult --compact \
            | jq '{result, totalTestCount, passedTests, failedTests, testFailures: ((.testFailures // [])[:40])}' || true
          echo "--- end of the test log ---"
          xcrun xcresulttool get log --path build/WindRunTests.xcresult --type action 2>/dev/null | tail -n 200 || true

      # A crashed test host leaves no stack in the result bundle; macOS keeps the crash report.
      - name: Show test host crash reports
        if: failure()
        run: |
          reports=$(ls -t ~/Library/Logs/DiagnosticReports/WindRun*.ips 2>/dev/null | head -n 2)
          [ -n "$reports" ] || { echo "No WindRun crash reports."; exit 0; }
          for report in $reports; do
            echo "=== $report"
            # Line 1 is a header; the rest is the report. Print the crashing thread's frames with their symbols.
            tail -n +2 "$report" | jq -r '
              .usedImages as $images
              | "\(.exception.type // "") \(.exception.signal // "") \(.termination.indicator // "")",
                (.asi // {} | tostring),
                (.threads[] | select(.triggered == true) | .frames[]
                  | "\($images[.imageIndex].name // "?")  \(.symbol // "?")+\(.symbolLocation // 0)  \(.sourceFile // ""):\(.sourceLine // "")")
            ' || head -c 20000 "$report"
          done

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WindRunTests-${{ github.run_number }}.xcresult
          path: build/WindRunTests.xcresult
          retention-days: 14

      - name: Prepare CloudKit Development and check Production
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_API_TOKEN }}
          CKTOOL_NO_PROMPT: '1'
        run: |
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Skipped this CloudKit update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$CLOUDKIT_MANAGEMENT_TOKEN" ]]; then
            echo "::error::Set CLOUDKIT_API_TOKEN to a CloudKit Management Token."
            exit 1
          fi

          work=$(mktemp -d "$RUNNER_TEMP/cloudkit.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          development="$work/development.ckdb"
          updated="$work/updated.ckdb"
          production="$work/production.ckdb"
          container=(--team-id KWZTWNA57G --container-id iCloud.com.stanleycloud.WindRun)

          # Command errors can contain live schema definitions. Report only the failed operation.
          schema_command() {
            local error_message="$1"
            shift
            if ! "$@" >/dev/null 2>&1; then
              echo "::error::$error_message"
              exit 1
            fi
          }

          attachments="$work/attachments"
          xcrun xcresulttool export attachments --path build/WindRunTests.xcresult \
            --test-id 'CloudKitSchemaTests/testExportCloudKitFields()' --output-path "$attachments"
          filename=$(jq -er '[.[].attachments[] | select(.suggestedHumanReadableName | startswith("WindRunCloudKitFields")) | .exportedFileName] | if length == 1 then .[0] else error("Expected one CloudKit model attachment") end' "$attachments/manifest.json")
          fields="$attachments/$filename"

          schema_command "Could not export the CloudKit Development schema." \
            xcrun cktool export-schema "${container[@]}" --environment development --output-file "$development"
          schema_command "Could not reconcile the WindRun models with CloudKit Development. Check the schema in CloudKit Console." \
            python3 scripts/release/merge-cloudkit-schema.py "$development" "$fields" "$updated"

          if ! cmp -s "$development" "$updated"; then
            git fetch --no-tags --depth=1 origin main
            if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
              echo "A newer commit is on main. Skipped this CloudKit import." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            schema_command "Could not validate or import the schema into CloudKit Development." \
              xcrun cktool import-schema "${container[@]}" --environment development --validate --file "$updated"
            rm "$development"
            schema_command "Could not verify the updated CloudKit Development schema." \
              xcrun cktool export-schema "${container[@]}" --environment development --output-file "$development"
            schema_command "The updated CloudKit Development schema conflicts with the WindRun models." \
              python3 scripts/release/merge-cloudkit-schema.py "$development" "$fields" "$updated"
            if ! cmp -s "$development" "$updated"; then
              echo "::error::CloudKit Development is still missing fields required by the tested models."
              exit 1
            fi
            echo "Added fields from the tested WindRun models to CloudKit Development." >> "$GITHUB_STEP_SUMMARY"
          fi

          schema_command "Could not export the CloudKit Production schema." \
            xcrun cktool export-schema "${container[@]}" --environment production --output-file "$production"
          test -s "$production"
          if cmp -s "$development" "$production"; then
            echo "The CloudKit Development and Production schemas match." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CloudKit Development and Production differ. Review **Deploy Schema Changes** in [CloudKit Console](https://icloud.developer.apple.com/) before merging main into staging." >> "$GITHUB_STEP_SUMMARY"
          fi
