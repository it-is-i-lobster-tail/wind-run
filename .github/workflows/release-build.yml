name: Release build

# Shared by the TestFlight and App Store workflows: signs a Release build with
# the distribution certificate, uploads it with fastlane, and keeps the .ipa
# and dSYMs as a workflow artifact.
on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      environment:
        required: true
        type: string
      artifact-prefix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and upload
    runs-on: macos-26
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    steps:
      - name: Check the signing secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets to the ${{ inputs.environment }} environment or the repository:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, sign and upload
        id: fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
          TESTFLIGHT_EXTERNAL: ${{ vars.TESTFLIGHT_EXTERNAL }}
          APP_STORE_AUTOMATIC_RELEASE: ${{ vars.APP_STORE_AUTOMATIC_RELEASE }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane ios ${{ inputs.lane }}

      - name: Keep the build
        if: steps.fastlane.outputs.build != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ steps.fastlane.outputs.version }}-${{ steps.fastlane.outputs.build }}
          path: |
            build/WindRun.ipa
            build/WindRun.app.dSYM.zip
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: steps.fastlane.outputs.build != ''
        run: |
          echo "### Wind Run ${{ steps.fastlane.outputs.version }} (${{ steps.fastlane.outputs.build }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`${GITHUB_SHA::7}\` on ${{ github.ref_name }} and sent through the \`${{ inputs.lane }}\` lane." >> "$GITHUB_STEP_SUMMARY"
