name: Beta

# Every merge of main into staging gives the build Xcode Cloud already made
# from that main commit to the external TestFlight beta groups. Nothing is
# rebuilt, so beta testers get the same version and build number as alpha.
on:
  push:
    branches: [staging]
  workflow_dispatch:

# Beta and App Store promotions take turns with App Store Connect.
concurrency:
  group: app-store-connect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  beta:
    name: Promote to TestFlight beta
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: testflight
    # Waits up to an hour for Xcode Cloud to finish the build.
    timeout-minutes: 90
    steps:
      - name: Check the App Store Connect secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets to the testflight environment or the repository:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Find the main commit Xcode Cloud built
        id: source
        run: echo "commit=$(scripts/release/built-commit.sh HEAD origin/main)" >> "$GITHUB_OUTPUT"

      - name: Give its build to the beta groups
        id: fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TESTFLIGHT_BETA_GROUPS: ${{ vars.TESTFLIGHT_BETA_GROUPS || 'Beta' }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: bundle exec fastlane ios promote_beta commit:${{ steps.source.outputs.commit }}

      - name: Tag the beta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.fastlane.outputs.version }}-beta.${{ steps.fastlane.outputs.build }}
          SHA: ${{ steps.fastlane.outputs.commit }}
        run: scripts/release/tag.sh "$TAG" "$SHA"

      - name: Summary
        run: |
          echo "### Wind Run ${{ steps.fastlane.outputs.version }} (${{ steps.fastlane.outputs.build }}) is in beta" >> "$GITHUB_STEP_SUMMARY"
          echo "Built by Xcode Cloud from \`${{ steps.fastlane.outputs.commit }}\` on main, tagged \`v${{ steps.fastlane.outputs.version }}-beta.${{ steps.fastlane.outputs.build }}\`." >> "$GITHUB_STEP_SUMMARY"
