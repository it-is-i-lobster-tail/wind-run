name: Promotion guard

# staging only takes main, and prod only takes staging. The rulesets require
# this check, so a pull request from any other branch can't be merged.
on:
  pull_request:
    branches: [staging, prod]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  source-branch:
    permissions:
      contents: write
      pull-requests: write
    name: Source branch
    runs-on: ubuntu-latest
    steps:
      - name: Check where the pull request comes from
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          case "$BASE" in
            staging) allowed=main ;;
            prod) allowed=staging ;;
            *) echo "::error::No promotion rule for $BASE."; exit 1 ;;
          esac
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$HEAD" != "$allowed" ]; then
            echo "::error::$BASE only takes pull requests from $allowed. This one comes from $HEAD_REPO:$HEAD."
            exit 1
          fi
          echo "$HEAD → $BASE is allowed."

      # Staging promotes an existing main archive. Refresh before that merge so a
      # changed dataset is built and signed on main by the normal Xcode Cloud job.
      - uses: actions/checkout@v5
        if: github.base_ref == 'staging'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        if: github.base_ref == 'staging'
        with:
          python-version: '3.13'
      - name: Download and package current full-detail US boundaries
        if: github.base_ref == 'staging'
        run: |
          python -m pip install -r scripts/offline_areas/requirements.txt
          python scripts/offline_areas/build.py --output "$RUNNER_TEMP/us-areas"
      - name: Check the dataset in the build being promoted
        if: github.base_ref == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/offline_areas/check-promotion.sh "$RUNNER_TEMP/us-areas"
