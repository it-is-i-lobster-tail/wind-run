name: Offline area pack

# Rebuilds the offline US area pack from the latest Overture release once the one the app ships is more
# than 90 days old. The new pack goes up as a GitHub release asset, and a pull request to main points
# scripts/offline_areas/pack.json at it. Merging that PR ships it; the app then tags every workout again,
# a few at a time in the background.
#
# Creating the PR needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests". A PR opened by this workflow doesn't start CI by itself, so the last step starts CI on it.
on:
  schedule:
    # Mondays, 09:17 UTC.
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the pack is less than 90 days old
        type: boolean
        default: false

permissions: {}

concurrency:
  group: offline-area-pack

jobs:
  refresh:
    name: Rebuild when older than 90 days
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check the shipped pack's age
        id: age
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          built=$(jq -r '.built' scripts/offline_areas/pack.json)
          age=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          echo "The shipped pack was built $built, $age days ago."
          if [ "$age" -le 90 ] && [ "$FORCE" != "true" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "The offline area pack is $age days old. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for an open refresh
        id: open
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --base main --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("offline-areas/"))][0].number // empty')
          if [ -n "$number" ]; then
            echo "Refresh PR #$number is still open. Merge or close it first." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.age.outputs.stale == 'true' && steps.open.outputs.skip != 'true'
        with:
          python-version: '3.13'

      - name: Build the pack from the latest Overture release
        if: steps.age.outputs.stale == 'true' && steps.open.outputs.skip != 'true'
        run: |
          python -m pip install -r scripts/offline_areas/requirements.txt
          python scripts/offline_areas/build.py --output "$RUNNER_TEMP/pack"

      - name: Publish the pack and open a PR
        if: steps.age.outputs.stale == 'true' && steps.open.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info="$RUNNER_TEMP/pack/pack-info.json"
          built=$(jq -r '.built' "$info")
          release=$(jq -r '.release' "$info")
          tag="offline-areas-$built"
          gh release create "$tag" "$RUNNER_TEMP/pack/USAreas.sqlite" --target main --latest=false \
            --title "Offline US areas $built" \
            --notes "Offline US area pack built $built from Overture Maps release $release, for history search. Licensed under ODbL 1.0 (© OpenStreetMap contributors); see WindRun/OfflineAreas/Resources/OfflineAreasNotices.txt."
          jq --arg tag "$tag" '{tag: $tag, asset: "USAreas.sqlite", sha256, release, built, bytes, format, digest, counts}' "$info" \
            > scripts/offline_areas/pack.json
          branch="offline-areas/$built"
          git switch -c "$branch"
          git add scripts/offline_areas/pack.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Ship the offline US area pack built $built from Overture $release"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh the offline US area pack ($built)" \
            --body "The shipped offline area pack was more than 90 days old, so this workflow rebuilt it from Overture Maps release $release and published it as release \`$tag\`. Merging points the app at the new pack. Each workout is then tagged again in the background, newest first."
          gh workflow run ci.yml --ref "$branch"
